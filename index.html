<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fff0f3">
    <meta name="description" content="一封带有打字机、爱心、烟花和音乐的情人节告白信。">
    <title>致我最爱的你 - 情人节快乐</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%95%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            color-scheme: light;
            --bg-pink: #fff0f3;
            --bg-blue: #e8f4f8;
            --accent-pink: #e91e63;
            --accent-rose: #ff6b9d;
            --accent-blue: #5eb3c4;
            --accent-teal: #4db6ac;
            --text-dark: #2d3436;
            --text-soft: #636e72;
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-border: rgba(255, 255, 255, 0.8);
            --orb-1-color: #ffb6c1;
            --orb-2-color: #87ceeb;
            --orb-3-color: #ffc0cb;
            --footer-bg: linear-gradient(135deg, rgba(255, 182, 193, 0.2), rgba(93, 179, 196, 0.1));
            --shadow-soft: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --bg-pink: #1a1a2e;
            --bg-blue: #16213e;
            --accent-pink: #ff6b9d;
            --accent-rose: #ff8fab;
            --accent-blue: #4fc3dc;
            --accent-teal: #26d0ce;
            --text-dark: #f4f4f5;
            --text-soft: #c3c3cc;
            --card-bg: rgba(30, 30, 50, 0.95);
            --card-border: rgba(255, 255, 255, 0.12);
            --orb-1-color: #ff6b9d;
            --orb-2-color: #4fc3dc;
            --orb-3-color: #9d4edd;
            --footer-bg: linear-gradient(135deg, rgba(255, 107, 157, 0.15), rgba(79, 195, 220, 0.1));
            --shadow-soft: 0 25px 60px -18px rgba(0, 0, 0, 0.55);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100svh;
            overflow-x: hidden;
            font-family: 'Noto Serif SC', 'Songti SC', 'Microsoft YaHei', serif;
            color: var(--text-dark);
            background: linear-gradient(135deg, var(--bg-pink) 0%, var(--bg-blue) 50%, var(--bg-pink) 100%);
            transition: background 0.5s ease, color 0.5s ease;
        }

        button {
            font: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .bg-layer,
        .hearts-container,
        #fireworks-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .bg-layer {
            z-index: 0;
            overflow: hidden;
        }

        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: orbFloat 20s ease-in-out infinite;
            will-change: transform;
        }

        .orb-1 {
            width: min(60vw, 400px);
            aspect-ratio: 1;
            background: radial-gradient(circle, var(--orb-1-color), transparent 68%);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: min(70vw, 500px);
            aspect-ratio: 1;
            background: radial-gradient(circle, var(--orb-2-color), transparent 68%);
            right: -150px;
            bottom: -150px;
            animation-delay: -7s;
        }

        .orb-3 {
            width: min(48vw, 300px);
            aspect-ratio: 1;
            background: radial-gradient(circle, var(--orb-3-color), transparent 68%);
            top: 50%;
            left: 50%;
            animation-delay: -14s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            25% { transform: translate3d(30px, -30px, 0) scale(1.05); }
            50% { transform: translate3d(-20px, 20px, 0) scale(0.95); }
            75% { transform: translate3d(20px, 30px, 0) scale(1.02); }
        }

        .hearts-container {
            z-index: 1;
            overflow: hidden;
        }

        .falling-heart {
            position: absolute;
            top: -48px;
            opacity: 0;
            animation: heartFall linear forwards;
            will-change: transform, opacity;
        }

        @keyframes heartFall {
            0% { transform: translate3d(0, 0, 0) rotate(0deg) scale(0.8); opacity: 0; }
            12%, 86% { opacity: 0.72; }
            100% { transform: translate3d(0, 105vh, 0) rotate(360deg) scale(0.6); opacity: 0; }
        }

        #fireworks-canvas {
            z-index: 2;
        }

        [data-theme="dark"] #fireworks-canvas {
            mix-blend-mode: screen;
        }

        .theme-toggle {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
            z-index: 100;
            display: grid;
            place-items: center;
            width: 50px;
            height: 50px;
            border: 1px solid var(--card-border);
            border-radius: 999px;
            color: var(--accent-pink);
            background: var(--card-bg);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            backdrop-filter: blur(14px);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.5s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-1px) scale(1.06);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .theme-toggle:focus-visible,
        .view-letter-btn:focus-visible,
        .control-btn:focus-visible {
            outline: 3px solid color-mix(in srgb, var(--accent-blue), white 20%);
            outline-offset: 3px;
        }

        .theme-toggle svg {
            width: 26px;
            height: 26px;
        }

        .sun-icon { fill: #ffd166; display: none; }
        .moon-icon { fill: #6366f1; display: block; }
        [data-theme="dark"] .sun-icon { display: block; }
        [data-theme="dark"] .moon-icon { display: none; }

        .main-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100svh;
            padding: 40px 20px 80px;
        }

        .title-section {
            margin-bottom: 34px;
            text-align: center;
            animation: fadeInDown 1s ease-out both;
        }

        .main-title {
            margin: 0 0 10px;
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.7rem, 9vw, 5rem);
            line-height: 1.05;
            color: var(--accent-pink);
            text-shadow: 2px 2px 0 rgba(255, 107, 157, 0.2);
        }

        .sub-title {
            margin: 0;
            font-size: clamp(1rem, 3vw, 1.3rem);
            letter-spacing: 0.16em;
            color: var(--accent-pink);
        }

        .heartbeat-container {
            margin: 10px 0 24px;
            padding: 8px;
            border: 0;
            background: transparent;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .heartbeat-container:hover {
            transform: scale(1.1);
        }

        .heart-icon {
            display: block;
            width: 60px;
            height: 60px;
            color: var(--accent-pink);
            filter: drop-shadow(0 4px 15px rgba(233, 30, 99, 0.5));
            animation: heartbeat 1.2s ease-in-out infinite;
        }

        .heart-icon svg {
            display: block;
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.24); }
            30% { transform: scale(1); }
            45% { transform: scale(1.14); }
            60% { transform: scale(1); }
        }

        .letter-card {
            position: relative;
            width: min(100%, 800px);
            margin: 0 20px;
            padding: clamp(28px, 6vw, 50px);
            overflow: hidden;
            border: 1px solid var(--card-border);
            border-radius: 24px;
            background: var(--card-bg);
            box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(20px);
            animation: fadeInUp 1.15s ease-out 0.35s both;
            transition: background 0.5s ease, box-shadow 0.5s ease, border-color 0.5s ease;
        }

        .letter-card::before {
            content: '';
            position: absolute;
            inset: 0 0 auto;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-blue), var(--accent-rose));
        }

        .corner-deco {
            position: absolute;
            width: 80px;
            height: 80px;
            opacity: 0.32;
        }

        .corner-deco.top-left {
            top: 15px;
            left: 15px;
            border-top: 2px solid var(--accent-rose);
            border-left: 2px solid var(--accent-rose);
            border-radius: 8px 0 0 0;
        }

        .corner-deco.bottom-right {
            right: 15px;
            bottom: 15px;
            border-right: 2px solid var(--accent-blue);
            border-bottom: 2px solid var(--accent-blue);
            border-radius: 0 0 8px 0;
        }

        .letter-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            text-align: center;
            border-bottom: 1px dashed color-mix(in srgb, var(--accent-pink), transparent 78%);
        }

        .letter-date {
            margin: 0 0 15px;
            font-size: 0.92rem;
            color: var(--text-soft);
        }

        .letter-greeting {
            margin: 0;
            font-size: clamp(1.25rem, 4vw, 1.5rem);
            color: var(--accent-pink);
            font-weight: 600;
        }

        .view-letter-btn {
            display: block;
            width: min(100%, 280px);
            margin: 30px auto;
            padding: 16px 32px;
            border: 0;
            border-radius: 999px;
            color: #fff;
            background: linear-gradient(135deg, var(--accent-rose), var(--accent-pink));
            box-shadow: 0 4px 20px rgba(233, 30, 99, 0.4);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: pulse 2s ease-in-out infinite;
        }

        .view-letter-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 30px rgba(233, 30, 99, 0.5);
        }

        .view-letter-btn[hidden] {
            display: none;
        }

        .letter-body {
            display: none;
            min-height: 300px;
            max-height: min(500px, 58vh);
            padding-right: 10px;
            overflow-y: auto;
            color: var(--text-dark);
            font-family: 'KaiTi', 'STKaiti', 'Kaiti SC', '楷体', 'Noto Serif SC', serif;
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            line-height: 2;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-rose) rgba(233, 30, 99, 0.1);
        }

        .letter-body.visible {
            display: block;
            animation: fadeInUp 0.75s ease-out both;
        }

        .letter-body::-webkit-scrollbar { width: 6px; }
        .letter-body::-webkit-scrollbar-track {
            background: rgba(233, 30, 99, 0.1);
            border-radius: 999px;
        }
        .letter-body::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--accent-rose), var(--accent-pink));
            border-radius: 999px;
        }

        .letter-content {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            margin-left: 2px;
            background: var(--accent-pink);
            animation: blink 0.8s steps(1, end) infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .letter-footer {
            margin-top: 40px;
            padding-top: 20px;
            text-align: right;
            border-top: 1px dashed color-mix(in srgb, var(--accent-pink), transparent 78%);
        }

        .signature {
            margin: 0;
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: var(--accent-pink);
        }

        .signature-name {
            margin: 0;
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: var(--accent-pink);
        }

        .postscript {
            margin-top: 30px;
            padding: 20px;
            color: var(--text-soft);
            font-style: italic;
            background: var(--footer-bg);
            border-radius: 14px;
        }

        .postscript p {
            margin: 0;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .control-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            padding: 12px 24px;
            border: 0;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease, color 0.3s ease;
        }

        .control-btn svg {
            width: 20px;
            height: 20px;
            flex: 0 0 auto;
        }

        .btn-music {
            color: #fff;
            background: linear-gradient(135deg, var(--accent-rose), var(--accent-pink));
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.38);
        }

        .btn-firework {
            color: #fff;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-teal));
            box-shadow: 0 4px 15px rgba(94, 179, 196, 0.38);
        }

        .btn-replay {
            color: var(--accent-pink);
            background: var(--card-bg);
            border: 2px solid var(--accent-rose);
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.16);
        }

        .btn-replay:hover {
            color: #fff;
            background: var(--accent-rose);
        }

        .music-playing {
            animation: musicPulse 1s ease-in-out infinite;
        }

        @keyframes musicPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .hint-text {
            margin: 38px 0 0;
            color: var(--text-soft);
            font-size: clamp(1rem, 3vw, 1.1rem);
            text-align: center;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.62; }
            50% { opacity: 1; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 34px 12px 64px;
            }

            .letter-card {
                margin-inline: 10px;
                border-radius: 20px;
            }

            .letter-body {
                max-height: 430px;
            }

            .controls {
                width: min(100%, 260px);
                flex-direction: column;
                align-items: stretch;
            }

            .theme-toggle {
                width: 44px;
                height: 44px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.001ms !important;
            }

            .hearts-container,
            #fireworks-canvas {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="bg-layer" aria-hidden="true">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="hearts-container" id="hearts-container" aria-hidden="true"></div>
    <canvas id="fireworks-canvas" aria-hidden="true"></canvas>

    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深浅色主题" aria-pressed="false" title="切换主题">
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 18a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1zm9-9a1 1 0 0 1-1 1h-2a1 1 0 1 1 0-2h2a1 1 0 0 1 1 1zM5 12a1 1 0 0 1-1 1H2a1 1 0 1 1 0-2h2a1 1 0 0 1 1 1zm14.071-7.071a1 1 0 0 1 0 1.414l-1.414 1.414a1 1 0 1 1-1.414-1.414l1.414-1.414a1 1 0 0 1 1.414 0zM7.757 16.243a1 1 0 0 1 0 1.414L6.343 19.07a1 1 0 1 1-1.414-1.414l1.414-1.414a1 1 0 0 1 1.414 0zM19.07 19.07a1 1 0 0 1-1.414 0l-1.414-1.414a1 1 0 1 1 1.414-1.414l1.414 1.414a1 1 0 0 1 0 1.414zM7.757 7.757a1 1 0 0 1-1.414 0L4.93 6.343A1 1 0 0 1 6.343 4.93l1.414 1.414a1 1 0 0 1 0 1.414z"/>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>
        </svg>
    </button>

    <main class="main-content">
        <section class="title-section" aria-labelledby="page-title">
            <h1 class="main-title" id="page-title">To My Dearest</h1>
            <p class="sub-title">情人节快乐！</p>
        </section>

        <button class="heartbeat-container" id="heart-trigger" type="button" aria-label="点击触发烟花" title="点击触发烟花">
            <span class="heart-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </span>
        </button>

        <article class="letter-card" aria-labelledby="letter-title">
            <div class="corner-deco top-left" aria-hidden="true"></div>
            <div class="corner-deco bottom-right" aria-hidden="true"></div>

            <header class="letter-header">
                <p class="letter-date">写于 二月十四日 情人节</p>
                <h2 class="letter-greeting" id="letter-title">亲爱的宝贝：</h2>
            </header>

            <button class="view-letter-btn" id="view-letter-btn" type="button" aria-controls="letter-body">💌 点击查看信件</button>

            <div class="letter-body" id="letter-body" aria-live="polite">
                <div class="letter-content" id="letter-content">
                    <span class="typing-cursor" id="typing-cursor" aria-hidden="true"></span>
                </div>
            </div>

            <footer class="letter-footer">
                <p class="signature">永远爱你的</p>
                <p class="signature-name">Your Love</p>
            </footer>

            <div class="postscript">
                <p>P.S. 点击页面边缘或上方的爱心，稍等片刻，会有惊喜哦~</p>
            </div>
        </article>

        <div class="controls" aria-label="页面控制">
            <button class="control-btn btn-music" id="music-btn" type="button" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M9 18V5l12-2v13"/>
                    <circle cx="6" cy="18" r="3"/>
                    <circle cx="18" cy="16" r="3"/>
                </svg>
                <span>播放音乐</span>
            </button>
            <button class="control-btn btn-firework" id="firework-btn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                </svg>
                <span>放烟花</span>
            </button>
            <button class="control-btn btn-replay" id="replay-btn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M1 4v6h6M23 20v-6h-6"/>
                    <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                </svg>
                <span>重播信件</span>
            </button>
        </div>

        <p class="hint-text">* 点击页面边缘，稍等片刻，绽放爱的烟火 *</p>
    </main>

    <audio id="bg-music" loop autoplay preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        'use strict';

        const loveLetter = `今天是情人节，我想用这封信，把平时说不出口的话都告诉你。

还记得我们第一次见面吗？那时候我就觉得，这个女孩好特别，她的笑容像阳光一样温暖，让人忍不住想要靠近。

后来我们在一起了，每一天都像是被上天眷顾着。你的每一个小表情、每一次撒娇、每一句关心的话，我都珍藏在心里最柔软的地方。

        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const $ = (selector) => document.querySelector(selector);
        const letterContent = $('#letter-content');
        const typingCursor = $('#typing-cursor');
        const letterBody = $('#letter-body');
        const viewLetterBtn = $('#view-letter-btn');
        const musicBtn = $('#music-btn');
        const bgMusic = $('#bg-music');
        const fireworkBtn = $('#firework-btn');
        const replayBtn = $('#replay-btn');
        const heartTrigger = $('#heart-trigger');
        const heartsContainer = $('#hearts-container');
        const canvas = $('#fireworks-canvas');
        const ctx = canvas.getContext('2d');
        const themeToggle = $('#theme-toggle');
        const metaThemeColor = document.querySelector('meta[name="theme-color"]');

        let isMusicPlaying = true;
        let typingTimer = 0;
        let currentCharIndex = 0;
        let heartsTimer = 0;
        let animationId = 0;
        let lastFrameTime = 0;
        let isFireworksRunning = false;

        const fireworks = [];
        const particles = [];

        function setTheme(theme) {
            const isDark = theme === 'dark';
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            themeToggle.setAttribute('aria-pressed', String(isDark));
            metaThemeColor?.setAttribute('content', isDark ? '#1a1a2e' : '#fff0f3');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            setTheme(savedTheme || (systemDark ? 'dark' : 'light'));
        }

        function toggleTheme(event) {
            event.stopPropagation();
            const nextTheme = document.documentElement.hasAttribute('data-theme') ? 'light' : 'dark';
            setTheme(nextTheme);
        }

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const width = window.innerWidth;
            const height = window.innerHeight;

            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function resetLetter() {
            window.clearTimeout(typingTimer);
            currentCharIndex = 0;
            letterContent.replaceChildren(typingCursor);
            typingCursor.style.display = 'inline-block';
        }

        function getTypingDelay(char) {
            if (prefersReducedMotion) return 0;
            if ('。！？'.includes(char)) return 260;
            if ('，、'.includes(char)) return 130;
            if (char === '\n') return 190;
            return 62;
        }

        function typeWriter() {
            if (currentCharIndex >= loveLetter.length) {
                typingCursor.style.display = 'none';
                return;
            }

            const char = loveLetter[currentCharIndex];
            letterContent.insertBefore(document.createTextNode(char), typingCursor);
            currentCharIndex += 1;

            if (prefersReducedMotion) {
                while (currentCharIndex < loveLetter.length) {
                    const nextChar = loveLetter[currentCharIndex];
                    letterContent.insertBefore(document.createTextNode(nextChar), typingCursor);
                    currentCharIndex += 1;
                }
                typingCursor.style.display = 'none';
                return;
            }

            typingTimer = window.setTimeout(typeWriter, getTypingDelay(char));
        }

        function showLetter() {
            viewLetterBtn.hidden = true;
            letterBody.classList.add('visible');
            resetLetter();
            typingTimer = window.setTimeout(typeWriter, prefersReducedMotion ? 0 : 250);
        }

        function replayLetter(event) {
            event.stopPropagation();
            showLetter();
        }

        function createFallingHeart() {
            if (prefersReducedMotion || document.hidden) return;

            const heart = document.createElement('span');
            const size = Math.round(Math.random() * 20 + 15);
            const duration = Math.random() * 5 + 8;
            const delay = Math.random() * 3;
            const colors = ['#e91e63', '#ff6b9d', '#f48fb1', '#f8bbd9', '#4db6ac'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            heart.className = 'falling-heart';
            heart.style.left = `${Math.random() * 100}%`;
            heart.style.animationDuration = `${duration}s`;
            heart.style.animationDelay = `${delay}s`;
            heart.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" style="fill:${color}"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;

            heartsContainer.appendChild(heart);
            window.setTimeout(() => heart.remove(), (duration + delay) * 1000 + 100);
        }

        function startHearts() {
            if (prefersReducedMotion || heartsTimer) return;
            heartsTimer = window.setInterval(() => {
                if (Math.random() > 0.34) createFallingHeart();
            }, 850);
        }

        function stopHearts() {
            window.clearInterval(heartsTimer);
            heartsTimer = 0;
        }

        class Firework {
            constructor(sx, sy, tx, ty) {
                this.x = sx;
                this.y = sy;
                this.sx = sx;
                this.sy = sy;
                this.tx = tx;
                this.ty = ty;
                this.distanceToTarget = Math.hypot(tx - sx, ty - sy);
                this.distanceTraveled = 0;
                this.coordinates = Array.from({ length: 3 }, () => [this.x, this.y]);
                this.angle = Math.atan2(ty - sy, tx - sx);
                this.speed = 2;
                this.acceleration = 1.05;
                this.brightness = Math.random() * 50 + 50;
            }

            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.acceleration;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.distanceTraveled = Math.hypot(this.x - this.sx, this.y - this.sy);

                if (this.distanceTraveled >= this.distanceToTarget) {
                    createParticles(this.tx, this.ty);
                    fireworks.splice(index, 1);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsl(340 100% ${this.brightness}%)`;
                ctx.stroke();
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.coordinates = Array.from({ length: 5 }, () => [this.x, this.y]);
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 10 + 1;
                this.friction = 0.95;
                this.gravity = 0.9;
                this.decay = Math.random() * 0.03 + 0.01;
                this.alpha = 1;
                this.hue = chooseParticleHue();
            }

            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;

                if (this.alpha <= this.decay) {
                    particles.splice(index, 1);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.lineWidth = 2;
                ctx.strokeStyle = `hsla(${this.hue}, 100%, 65%, ${this.alpha})`;
                ctx.stroke();
            }
        }

        function chooseParticleHue() {
            const isDark = document.documentElement.hasAttribute('data-theme');
            if (!isDark) {
                return Math.random() > 0.5 ? Math.random() * 60 + 330 : Math.random() * 40 + 170;
            }

            const colorChoice = Math.random();
            if (colorChoice < 0.25) return Math.random() * 60 + 330;
            if (colorChoice < 0.5) return Math.random() * 40 + 170;
            if (colorChoice < 0.75) return Math.random() * 60 + 270;
            return Math.random() * 40 + 30;
        }

        function createParticles(x, y) {
            const particleCount = prefersReducedMotion ? 0 : 80;
            for (let i = 0; i < particleCount; i += 1) {
                particles.push(new Particle(x, y));
            }
        }

        function launchFirework(x, y) {
            if (prefersReducedMotion) return;
            const targetX = Number.isFinite(x) ? x : Math.random() * window.innerWidth;
            const targetY = Number.isFinite(y) ? y : Math.random() * window.innerHeight * 0.5;
            fireworks.push(new Firework(window.innerWidth / 2, window.innerHeight, targetX, targetY));
            startFireworks();
        }

        function launchMultipleFireworks(event) {
            event?.stopPropagation();
            for (let i = 0; i < 5; i += 1) {
                window.setTimeout(() => launchFirework(), i * 200);
            }
        }

        function drawFireworks(timestamp = 0) {
            if (!isFireworksRunning) return;
            animationId = window.requestAnimationFrame(drawFireworks);

            if (timestamp - lastFrameTime < 16) return;
            lastFrameTime = timestamp;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
            ctx.globalCompositeOperation = 'lighter';

            for (let i = fireworks.length - 1; i >= 0; i -= 1) {
                fireworks[i].draw();
                fireworks[i].update(i);
            }

            for (let i = particles.length - 1; i >= 0; i -= 1) {
                particles[i].draw();
                particles[i].update(i);
            }

            if (!fireworks.length && !particles.length) {
                stopFireworks();
            }
        }

        function startFireworks() {
            if (prefersReducedMotion || isFireworksRunning) return;
            isFireworksRunning = true;
            animationId = window.requestAnimationFrame(drawFireworks);
        }

        function stopFireworks() {
            isFireworksRunning = false;
            window.cancelAnimationFrame(animationId);
            animationId = 0;
        }

        function updateMusicButton() {
            const label = isMusicPlaying ? '暂停音乐' : '播放音乐';
            musicBtn.querySelector('span').textContent = label;
            musicBtn.classList.toggle('music-playing', isMusicPlaying);
            musicBtn.setAttribute('aria-pressed', String(isMusicPlaying));
        }

        async function tryPlayMusic() {
            try {
                await bgMusic.play();
                isMusicPlaying = true;
            } catch (error) {
                isMusicPlaying = false;
                console.info('自动播放被浏览器拦截，等待用户第一次点击后再播放。', error);
            }
            updateMusicButton();
        }

        function enableMusicOnFirstGesture() {
            if (isMusicPlaying) return;
            bgMusic.play().then(() => {
                isMusicPlaying = true;
                updateMusicButton();
                document.removeEventListener('pointerdown', enableMusicOnFirstGesture);
            }).catch((error) => {
                console.info('音乐播放失败，请确认 music.mp3 存在。', error);
            });
        }

        async function toggleMusic(event) {
            event.stopPropagation();

            try {
                if (isMusicPlaying) {
                    bgMusic.pause();
                    isMusicPlaying = false;
                } else {
                    await bgMusic.play();
                    isMusicPlaying = true;
                }
            } catch (error) {
                isMusicPlaying = false;
                console.info('音乐播放失败，请确认 music.mp3 存在，或由用户点击后再播放。', error);
            }

            updateMusicButton();
        }

        function handlePageClick(event) {
            if (event.target.closest('button')) return;
            launchFirework(event.clientX, event.clientY);
        }

        function handleVisibilityChange() {
            if (document.hidden) {
                stopHearts();
                stopFireworks();
            } else {
                startHearts();
                if (fireworks.length || particles.length) startFireworks();
            }
        }

        function init() {
            initTheme();
            resizeCanvas();
            startHearts();
            updateMusicButton();
            tryPlayMusic();

            themeToggle.addEventListener('click', toggleTheme);
            window.addEventListener('resize', resizeCanvas, { passive: true });
            musicBtn.addEventListener('click', toggleMusic);
            fireworkBtn.addEventListener('click', launchMultipleFireworks);
            replayBtn.addEventListener('click', replayLetter);
            heartTrigger.addEventListener('click', launchMultipleFireworks);
            viewLetterBtn.addEventListener('click', (event) => {
                event.stopPropagation();
                showLetter();
            });
            document.addEventListener('click', handlePageClick);
            document.addEventListener('pointerdown', enableMusicOnFirstGesture, { passive: true });
            document.addEventListener('visibilitychange', handleVisibilityChange);

            if (!prefersReducedMotion) {
                window.setTimeout(launchMultipleFireworks, 500);
            }
        }

        document.addEventListener('DOMContentLoaded', init, { once: true });
    </script>
</body>
